<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>水利さがし</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="map"></div>

<!-- 上:検索(住所・現在地・メニュー) -->
<header id="top">
  <input id="q" placeholder="火事の住所" enterkeyhint="search" autocomplete="off">
  <button class="ib" data-act="loc" aria-label="現在地を火点にする">📍</button>
  <button class="btn pri" data-act="search">さがす</button>
  <button class="ib" data-act="menu" aria-label="メニュー">☰</button>
</header>
<div id="menu">
  <button data-act="mkmenu">＋ 現場マーカー</button>
  <button data-act="share">🔗 共有リンク</button>
  <button data-act="font">Aa 文字の大きさ</button>
  <button data-act="help">？ 使い方</button>
</div>
<div id="cand"></div>

<!-- 下:結果(小さくたたんでおける) -->
<section id="sheet">
  <div id="grab" title="ドラッグで高さ変更/タップで開閉"><i></i></div>
  <div id="shead"></div><div id="sdetail"></div><div id="slist"></div>
</section>

<!-- 経路・マーカーを置くときの操作バー(下) -->
<div id="modebar"></div>

<div class="modal" id="mkmenu"><div>
  <h2>置くものを選んでください</h2>
  <div class="grid">
    <button class="btn" data-act="addmk" data-v="truck">🚒<br>消防車</button>
    <button class="btn" data-act="addmk" data-v="loader">🚐<br>積載車</button>
    <button class="btn" data-act="addmk" data-v="guard">🅰<br>警備地点</button>
    <button class="btn" data-act="addmk" data-v="road">⛔<br>通行止め</button>
  </div>
  <button class="btn big" data-act="closemodal">やめる</button>
</div></div>

<div class="modal" id="help"><div>
  <h2>使い方</h2>
  <ol class="steps">
    <li>住所を入れて<b>「さがす」</b>を押す</li>
    <li>近くの<b>消火栓(●栓)</b>と<b>防火水槽(■水)</b>が地図に出ます</li>
    <li>水利を押すと、<b>状態の記録</b>と<b>ホースの本数</b>が出ます</li>
    <li>🔥は指でずらせます。地図の長押し(PCは右クリック)でも場所を決められます</li>
  </ol>
  <button class="btn big" data-act="endincident">この現場の記録を消す</button>
  <a class="btn big" href="quiz.html">地水利クイズ(練習)</a>
  <a class="btn big" href="admin.html">管理者の方(データ更新)</a>
  <details><summary>出典・ライセンス</summary><p class="note" id="credits"></p></details>
  <button class="btn big pri" data-act="closemodal">閉じる</button>
</div></div>

<div id="toast"></div>
<script src="vendor/leaflet.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
