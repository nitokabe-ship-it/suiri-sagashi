<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>地水利クイズ - 水利さがし</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
<style>
/* クイズ画面だけの見た目(index.html には影響しません) */
#qbar{position:absolute;z-index:1000;top:calc(env(safe-area-inset-top) + 6px);left:6px;right:6px;display:flex;gap:6px;align-items:center;background:#fff;border-radius:12px;padding:6px;box-shadow:0 3px 12px rgba(0,0,0,.25)}
#qbar a.btn{min-height:44px;line-height:40px;padding:0 12px;flex:none}
#qt{flex:1;min-width:0;font-weight:800;font-size:.9em;line-height:1.3}
#qpanel{position:absolute;z-index:1000;left:0;right:0;bottom:0;max-height:52dvh;overflow:auto;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -3px 14px rgba(0,0,0,.25);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px)}
.leaflet-top.leaflet-right{margin-top:calc(env(safe-area-inset-top) + 62px)}
.q{font-weight:900;margin:6px 0}
.scen{color:var(--mut);font-size:.82em;margin:4px 0}
.exp{background:#fff8d6;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.92em}
.exp details{margin:6px 0}.exp small{color:var(--mut)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.seg .btn{padding:0 4px;line-height:44px}
select{width:100%;height:48px;font:inherit;border:2px solid var(--line);border-radius:10px;padding:0 10px;margin:6px 0;background:#fff}
.opt{display:block;width:100%;min-height:48px;margin:5px 0;padding:0 12px;text-align:left;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:800}
.opt.ok{background:#2e7d32;border-color:#2e7d32;color:#fff}
.opt.ng{background:#c62828;border-color:#c62828;color:#fff}
.opt:disabled{opacity:1}
.rowk{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee}
/* 地図の印(形=種類:●消火栓 ■防火水槽) */
.qm{width:30px;height:30px;border-radius:50%;background:#1565c0;color:#fff;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.qm.tank{border-radius:7px}
.qm.ok{background:#2e7d32;outline:3px solid #ffd60a}
.qm.ban{background:#c62828}
@media(min-width:700px){
  #qbar{right:auto;width:420px}
  #qpanel{left:6px;right:auto;width:420px;bottom:6px;border-radius:12px;max-height:calc(100dvh - 76px)}
}
</style>
</head><body>
<div id="map"></div>
<header id="qbar"><a class="btn" href="index.html">← 地図</a><div id="qt">地水利クイズ</div></header>
<section id="qpanel"><div class="exp">読み込み中…</div></section>
<script src="vendor/leaflet.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="quiz.js"></script>
</body></html>
